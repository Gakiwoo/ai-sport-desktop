name: CI (macOS)

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  VITE_MEDIAPIPE_CDN: https://cdn.jsdelivr.net
  CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target

jobs:
  lint-test-build:
    runs-on: macos-latest

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # @ai-sport/core 为 file:../packages/ai-sport-core 依赖，且 vite/tsconfig 直接
      # 引用 ../packages/ai-sport-core 源码——独立 checkout 本仓库时该目录不存在，
      # npm ci 必然失败。从父仓库（ai-sport-system）拉取 core 源码到期望位置。
      - name: Fetch @ai-sport/core source from parent repo
        uses: actions/checkout@v4
        with:
          repository: Gakiwoo/ai-sport-system
          path: parent
          sparse-checkout: packages/ai-sport-core

      - name: Place @ai-sport/core source
        run: |
          mkdir -p ../packages
          cp -r parent/packages/ai-sport-core ../packages/
          rm -rf parent

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      # --- Stage 1: Lint ---
      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check

      # --- Stage 2: Test ---
      - name: Run tests
        run: npm run test

      # --- Stage 3: Build ---
      - name: Type check
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      - name: Build unsigned macOS DMG
        run: npm run tauri -- build --bundles dmg --no-sign

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: ai-sport-desktop-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
